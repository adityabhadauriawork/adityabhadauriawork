<svg viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2d1b69" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="-20%" y1="0%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#9be8ff"/>
      <stop offset="100%" stop-color="#00F5FF"/>
      <animate attributeName="x1" values="-100%;120%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;220%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2.5;5;2.5" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="350" fill="url(#bg)"/>
  <rect width="1200" height="350" fill="url(#glow)"/>

  <g stroke="#00F5FF" stroke-opacity="0.05">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="1050" y1="0" x2="1050" y2="350"/>
  </g>

  <g fill="#ffffff">
    <circle cx="70" cy="55" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="40" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="90" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="45" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="70" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="300" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="290" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.9s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="30" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="150" cy="285" r="45" fill="#00F5FF" opacity="0.07">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1055" cy="260" r="35" fill="#B39DDB" opacity="0.09">
    <animateTransform attributeName="transform" type="translate" values="0 0; -12 8; 0 0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="80" r="20" fill="#00F5FF" opacity="0.1">
    <animateTransform attributeName="transform" type="translate" values="0 0; 10 10; 0 0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(1090,85)">
    <circle r="20" fill="#7dd3fc" opacity="0.95"/>
    <circle r="20" fill="#00F5FF" opacity="0.3">
      <animate attributeName="r" values="20;26;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="38" ry="9" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="50" font-weight="700" fill="url(#titleGrad)" filter="url(#glowFilter)">
    Aditya Pratap Singh Bhadauria
  </text>

  <rect x="600" y="178" width="0" height="3" fill="url(#titleGrad)" rx="1.5">
    <animate attributeName="width" values="0;620" dur="1.3s" fill="freeze"/>
    <animate attributeName="x" values="600;290" dur="1.3s" fill="freeze"/>
  </rect>

  <text x="600" y="222" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="21" fill="#B39DDB" opacity="0">
    Software Engineer ✦ AI/ML Engineer ✦ Backend Developer
    <animate attributeName="opacity" values="0;0;1" dur="2s" begin="0.6s" fill="freeze"/>
  </text>

  <text x="600" y="258" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#7c8db5" opacity="0">
    building AI systems that scale 🚀
    <animate attributeName="opacity" values="0;0;1" dur="2s" begin="1.4s" fill="freeze"/>
  </text>
</svg>
